spring:
  application:
    name: architecture-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/architecture}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: ${SERVER_PORT:8000}

app:
  jwt:
    secret: ${SECRET_KEY:local-development-secret-key-change-me}
    access-token-minutes: ${ACCESS_TOKEN_EXPIRE_MINUTES:60}
